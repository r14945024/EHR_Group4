services:
  hapi-fhir:
    image: hapiproject/hapi:v6.6.0
    user: root
    ports:
      - "8081:8080"
    environment:
      - JAVA_OPTS=-Xmx2g
      - spring.datasource.url=jdbc:h2:file:/data/h2/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      - spring.datasource.driver-class-name=org.h2.Driver
      - spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
      - hapi.fhir.bulk_export_enabled=true
      - server.servlet.context-path=/fhir
    volumes:
      - hapi-data:/data
    restart: unless-stopped

volumes:
  hapi-data:

networks:
  default:
    name: fhir-network
